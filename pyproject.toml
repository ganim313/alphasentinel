[project]
name = "alphasentinel"
version = "0.1.0"
description = "Autonomous Quant Trading OS for Indian Small & Micro-Caps ($0 Budget)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "jugaad-data>=0.25",
    "tradingview-ta>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "python-telegram-bot>=21.4",
    "streamlit>=1.37.0",
    "plotly>=5.22.0",
    "schedule>=1.2.2",
    "psutil>=6.0.0",
    "portalocker>=2.8.2",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "fyers-apiv3>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
