/home/ubuntu/alphasentinel/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 ubuntu ubuntu
    sharedscripts
    postrotate
        # If there are any processes holding open log files (like gunicorn), send them HUP or reload
        # systemctl reload alphasentinel || true
    endscript
}
